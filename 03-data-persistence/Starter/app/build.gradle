apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
  namespace 'com.kodeco.android.swiftsdkforandroid.taskmanager'
  compileSdkVersion rootProject.ext.compileSdkVersion

  defaultConfig {
    applicationId "com.kodeco.android.swiftsdkforandroid.taskmanager"
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion
    versionCode 1
    versionName "1.0"
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }

  buildTypes {
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
    }
  }

  buildFeatures {
    compose true
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}


tasks.register('buildSwift') {
    group = 'swift'
    description = 'Builds Swift package for Android architectures'
    
    doLast {

        def architectures = [
            [triple: 'aarch64-unknown-linux-android28', dir: 'arm64-v8a', name: 'ARM64', swiftArch: 'aarch64', ndkArch: 'aarch64-linux-android'],
            [triple: 'armv7-unknown-linux-android28', dir: 'armeabi-v7a', name: 'ARMv7', swiftArch: 'armv7', ndkArch: 'arm-linux-androideabi'],
            [triple: 'x86_64-unknown-linux-android28', dir: 'x86_64', name: 'x86_64', swiftArch: 'x86_64', ndkArch: 'x86_64-linux-android']
        ]
        
        def packageDir = file("${projectDir}/../TaskManagerKit")
        

        if (!packageDir.exists()) {
            throw new GradleException("TaskManagerKit Swift Package not found at ${packageDir}")
        }
        
        // Find the Swift compiler (prefer swiftly, fallback to system)
        def swiftPath = System.getenv('HOME') + '/.swiftly/bin/swift'
        if (!file(swiftPath).exists()) {
            swiftPath = 'swift' // Fallback to system Swift
        }
        
        // Check if Swift is installed
        def swiftCheck = exec {
            commandLine swiftPath, '--version'
            ignoreExitValue true
            standardOutput = new ByteArrayOutputStream()
        }
        
        if (swiftCheck.exitValue != 0) {
            throw new GradleException("""
========================================
ERROR: Swift not found in PATH
========================================
Swift SDK for Android is required to build this project.

Please install Swift SDK for Android:
https://www.swift.org/documentation/articles/swift-sdk-for-android-getting-started.html

Installation steps:
1. Install swiftly (see swift.org/install/macos or swift.org/install/linux)
2. Install Swift: swiftly install 6.3-snapshot && swiftly use 6.3-snapshot
3. Install Swift SDK for Android (see swift.org/install/macos/#swift-sdk-buindles-dev)
4. Install and configure Android NDK 27
5. Link NDK to Swift SDK

=========================================
""")
        }
        
        // Check if Swift Android SDKs are available
        def sdkListCheck = exec {
            commandLine swiftPath, 'sdk', 'list'
            ignoreExitValue true
            standardOutput = new ByteArrayOutputStream()
        }
        
        if (sdkListCheck.exitValue != 0) {
            throw new GradleException("""
========================================
ERROR: Swift SDK for Android not configured
========================================
Swift is installed but Android SDKs are not configured.

Please complete Swift SDK for Android setup:
https://www.swift.org/documentation/articles/swift-sdk-for-android-getting-started.html

Steps to configure:
1. Download Swift SDK for Android from swift.org/install/macos/#swift-sdk-buindles-dev
2. Install Android NDK 27
3. Run the NDK setup script to link NDK to Swift SDK
4. Verify with: swift sdk list

=========================================
""")
        }
        
        println "Building Swift package from: ${packageDir}"
        
        architectures.each { arch ->
            println "\n========================================="
            println "Building for ${arch.name} (${arch.triple})"
            println "=========================================\n"
            

            def buildCommand = [
                swiftPath, 'build',
                '--swift-sdk', arch.triple,
                '--configuration', 'release'
            ]
            
            def buildResult = exec {
                workingDir packageDir
                commandLine buildCommand
                ignoreExitValue true
            }
            
            if (buildResult.exitValue != 0) {
                println "WARNING: Swift build failed for ${arch.name}"
                println "This may be because the Swift SDK for ${arch.triple} is not configured."
                println "Skipping ${arch.name}..."
                return
            }
            

            def sourceLib = file("${packageDir}/.build/${arch.triple}/release/libTaskManagerKit.so")
            def targetDir = file("${projectDir}/src/main/jniLibs/${arch.dir}")
            
            if (!sourceLib.exists()) {
                println "WARNING: Library not found at ${sourceLib}"
                println "Skipping ${arch.name}..."
                return
            }
            

            targetDir.mkdirs()
            

            copy {
                from sourceLib
                into targetDir
            }
            
            println "✓ Copied ${sourceLib.name} to ${arch.dir}/"
            

            def swiftSdkPath = System.getenv('HOME') + '/Library/org.swift.swiftpm/swift-sdks'
            def swiftRuntimeLibs = file("${swiftSdkPath}/swift-6.3-DEVELOPMENT-SNAPSHOT-2026-01-16-a_android.artifactbundle/swift-android/swift-resources/usr/lib/swift-${arch.swiftArch}/android")
            
            if (swiftRuntimeLibs.exists()) {

                copy {
                    from swiftRuntimeLibs
                    into targetDir
                    include '*.so'
                }
                println "✓ Copied Swift runtime libraries to ${arch.dir}/"
            } else {
                println "WARNING: Swift runtime libraries not found at ${swiftRuntimeLibs}"
            }
            

            def ndkPath = System.getenv('ANDROID_NDK_HOME')
            if (ndkPath) {
                def ndkCppLib = file("${ndkPath}/toolchains/llvm/prebuilt/darwin-x86_64/sysroot/usr/lib/${arch.ndkArch}/libc++_shared.so")
                if (ndkCppLib.exists()) {
                    copy {
                        from ndkCppLib
                        into targetDir
                    }
                    println "✓ Copied NDK C++ library to ${arch.dir}/"
                } else {
                    println "WARNING: NDK C++ library not found at ${ndkCppLib}"
                }
            } else {
                println "WARNING: ANDROID_NDK_HOME not set"
            }
        }
        

        println "\n========================================="
        println "Swift build complete!"
        println "Libraries copied to jniLibs/"
        println "=========================================\n"
    }
}


tasks.named('preBuild').configure {
    dependsOn 'buildSwift'
}

dependencies {
  implementation fileTree(dir: 'libs', include: ['*.jar'])

  // Kotlin
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

  // Compose BOM
  implementation platform('androidx.compose:compose-bom:2024.01.00')
  implementation 'androidx.compose.ui:ui'
  implementation 'androidx.compose.material3:material3'
  implementation 'androidx.compose.ui:ui-tooling-preview'
  implementation 'androidx.compose.material:material-icons-extended'
  debugImplementation 'androidx.compose.ui:ui-tooling'
  
  // Activity Compose
  implementation 'androidx.activity:activity-compose:1.8.2'
  
  // Core
  implementation 'androidx.core:core-ktx:1.12.0'
  implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
  implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'

  def camerax_version = "1.3.1"
  implementation "androidx.camera:camera-core:${camerax_version}"
  implementation "androidx.camera:camera-camera2:${camerax_version}"
  implementation "androidx.camera:camera-lifecycle:${camerax_version}"
  implementation "androidx.camera:camera-view:${camerax_version}"
  
  implementation "io.coil-kt:coil-compose:2.5.0"
  
  implementation "com.google.accompanist:accompanist-permissions:0.34.0"

  // Testing Dependencies
  testImplementation 'junit:junit:4.13.2'
  androidTestImplementation 'androidx.test.ext:junit:1.1.3'
  androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}
